services:
  mysql:
    build: ../expense-mysql-v1
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: devpass
    volumes:
      - expense_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../expense-backend-v1
    container_name: backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: expense_app
      DB_PASSWORD: devpass
      DB_NAME: expense_tracker
      DB_POOL_SIZE: 10
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      FRONTEND_ORIGIN: http://localhost
      AUTH_MODE: cookie
      # This stage has no otel-collector — turning tracing off avoids
      # periodic export-failure noise in the backend's own console log.
      # Traces arrive in v2-traces.
      ENABLE_TRACING: "false"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ../expense-frontend-v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # --- Metrics collection ---

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    # v0.15.x dropped DATA_SOURCE_NAME support — credentials come from a
    # mounted my.cnf file instead (see ./mysqld-exporter/.my.cnf). The
    # metrics_exporter DB user itself is provisioned by expense-mysql-v1's
    # own migrations, not anything in this compose file.
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    depends_on:
      - frontend

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    # Docker >=20.10 gives containers a private cgroup namespace by default on
    # cgroup v2 hosts. Without this, cadvisor only ever sees its own isolated
    # view of the cgroup tree and can't enumerate sibling containers at all.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - backend
      - frontend
      - mysql

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - mysqld-exporter
      - nginx-exporter
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  expense_mysql_data:

networks:
  default:
    name: expense-v1-metrics-net
